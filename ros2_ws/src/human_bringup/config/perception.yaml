# Parameters for the perception nodes (dissertation values).
yolo_node:
  ros__parameters:
    use_sim_time: true
    weights: yolov8n.pt            # downloaded on first run into weights_dir
    weights_dir: ~/.cache/human_detection
    confidence_threshold: 0.5
    device: cpu
    image_topic: /human_camera/image_raw
    detections_topic: /human_detections
    publish_debug_image: false
    debug_image_topic: /human_detections/debug_image
    stats_period: 5.0
