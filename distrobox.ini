# Alternative dev setup on Fedora: a distrobox built from the same image as
# docker/Dockerfile, so the package list lives in one place.
#
#   podman build -t human-aware-nav:jazzy -f docker/Dockerfile .
#   distrobox assemble create --file distrobox.ini
#   distrobox enter human-aware-nav
[human-aware-nav]
image=localhost/human-aware-nav:jazzy
pull=false
init=false
nvidia=false
start_now=false
